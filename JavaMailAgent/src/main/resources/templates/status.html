<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="30">
    <title>Mail Agent — Status</title>
    <style>
        body { font-family: monospace; padding: 24px; background: #1a1a1a; color: #ccc; margin: 0; }
        h1 { color: #fff; margin: 0 0 20px; font-size: 1.4em; }
        h2 { color: #aaa; font-size: 1em; margin: 20px 0 8px; }
        .stats { display: flex; gap: 16px; margin-bottom: 20px; }
        .stat { background: #252525; padding: 14px 20px; border-radius: 6px; min-width: 90px; }
        .stat .num { font-size: 2em; font-weight: bold; color: #5ba; }
        .stat .label { color: #666; font-size: 0.85em; margin-top: 2px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 4px; font-size: 0.85em; margin-bottom: 20px; }
        .up { background: #1a3a2a; color: #5ba; }
        .down { background: #3a1a1a; color: #a55; }
        .logs { background: #0e0e0e; padding: 12px; border-radius: 6px; font-size: 0.8em;
                height: 380px; overflow-y: auto; line-height: 1.5; }
        .log-line { padding: 1px 0; color: #999; }
        .log-line:hover { color: #ccc; }
        .footer { color: #444; font-size: 0.75em; margin-top: 12px; }
    </style>
</head>
<body>
    <h1>Mail Agent</h1>

    <div class="stats">
        <div class="stat">
            <div class="num" th:text="${inboxCount}">0</div>
            <div class="label">inbox</div>
        </div>
        <div class="stat">
            <div class="num" th:text="${processedCount}">0</div>
            <div class="label">processed</div>
        </div>
        <div class="stat">
            <div class="num" th:text="${draftsCount}">0</div>
            <div class="label">drafts</div>
        </div>
    </div>

    <div th:class="${memoryServiceHealthy} ? 'badge up' : 'badge down'"
         th:text="${memoryServiceHealthy} ? 'memory-service: UP' : 'memory-service: DOWN'">
    </div>

    <h2>Recent Logs</h2>
    <div class="logs">
        <div class="log-line" th:each="line : ${recentLogs}" th:text="${line}"></div>
    </div>

    <p class="footer">Auto-refresh every 30s</p>
</body>
</html>
