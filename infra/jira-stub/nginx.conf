server {
    listen 19997;
    server_name _;

    default_type application/json;

    location = /rest/api/2/myself {
        return 200 '{"accountId":"leader-account","displayName":"Leader User","emailAddress":"leader@example.com"}';
    }

    location = /rest/api/2/project/ENG {
        return 200 '{"id":"10001","key":"ENG","name":"Engineering","issueTypes":[{"id":"3","name":"Task","subtask":false},{"id":"4","name":"Bug","subtask":false}]}';
    }

    location = /rest/api/2/project/OPS {
        return 200 '{"id":"10002","key":"OPS","name":"Operations","issueTypes":[{"id":"3","name":"Task","subtask":false}]}';
    }

    location = /rest/api/2/user/assignable/search {
        return 200 '[{"accountId":"leader-account","displayName":"Leader User","emailAddress":"leader@example.com","active":true},{"accountId":"dev-ivan","displayName":"Ivan Petrov","emailAddress":"ivan.petrov@example.com","active":true}]';
    }

    location = /rest/api/2/issue {
        if ($request_method != POST) {
            return 405;
        }
        return 201 '{"id":"124","key":"ENG-124","self":"http://localhost:19997/rest/api/2/issue/124"}';
    }

    location = /browse/ENG-124 {
        default_type text/html;
        return 200 '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ENG-124</title></head><body><h1>ENG-124</h1><p>LeaderOS Jira Stub</p></body></html>';
    }

    location / {
        return 404 '{"errorMessages":["Not found"],"errors":{}}';
    }
}
