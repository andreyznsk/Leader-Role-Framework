<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Редактирование задачи')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container los-page-content">
    <div class="d-flex align-items-center mb-3">
        <a href="/ui/today" class="btn btn-sm btn-outline-secondary me-3">← Назад</a>
        <h4 class="mb-0">Задача #<span th:text="${task.id}"></span></h4>
        <span th:if="${task.source}" class="badge bg-secondary ms-2" th:text="${task.source}"></span>
        <span th:if="${task.emailId}" class="badge bg-info ms-1 small" th:text="${task.emailId}"></span>
    </div>

    <form method="post" th:action="@{/ui/tasks/{id}/edit(id=${task.id})}" id="task-edit-form"
          th:attr="data-task-id=${task.id}">
        <input type="hidden" name="_method" value="PUT">

        <!-- Title -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Название</label>
            <input type="text" name="title" class="form-control"
                   th:value="${task.title}" required/>
        </div>

        <!-- Description with markdown editor -->
        <div class="mb-3">
            <label class="form-label fw-semibold">Описание</label>
            <textarea id="md-input" name="description" class="form-control"
                      rows="25" style="font-family:monospace"
                      th:text="${description}"></textarea>
            <!-- Links preview (CR-MEM-009) -->
            <div id="task-editor-links" class="task-editor-links mt-2 d-none">
                <div class="task-editor-links-label">Ссылки из описания:</div>
                <ul id="task-editor-links-list"></ul>
            </div>
            <div class="mt-1">
                <a class="btn btn-sm btn-outline-secondary" th:href="${exportUrl}">Export MD</a>
            </div>
        </div>

        <!-- Metadata row -->
        <div class="row g-3 mb-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold">Приоритет</label>
                <select name="priority" class="form-select">
                    <option value="LOW" th:selected="${task.priority == 'LOW'}">LOW</option>
                    <option value="NORMAL" th:selected="${task.priority == 'NORMAL'}">NORMAL</option>
                    <option value="HIGH" th:selected="${task.priority == 'HIGH'}">HIGH</option>
                    <option value="CRITICAL" th:selected="${task.priority == 'CRITICAL'}">CRITICAL</option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">Дедлайн</label>
                <input type="date" name="dueDate" class="form-control"
                       th:value="${task.dueDate}"/>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold d-block">Статус</label>
                <div class="d-flex flex-wrap gap-1 pt-1">
                    <th:block th:each="s : ${ {'TODO','IN_PROGRESS','BLOCKED','DONE'} }">
                        <label class="mb-0">
                            <input type="radio" name="status" th:value="${s}"
                                   th:checked="${task.status == s}" class="visually-hidden status-radio"/>
                            <span class="badge px-2 py-1 status-option"
                                  th:text="${s}"
                                  th:classappend="${(s == 'TODO' ? ' status-option--todo' : (s == 'IN_PROGRESS' ? ' status-option--in-progress' : (s == 'BLOCKED' ? ' status-option--blocked' : ' status-option--done'))) + (task.status == s ? ' is-selected' : '')}"></span>
                        </label>
                    </th:block>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div id="save-status" class="alert alert-success py-2 px-3 mb-3 d-none" role="status"></div>
        <div class="d-flex justify-content-between">
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" name="action" value="save">Сохранить</button>
                <button type="submit" class="btn btn-outline-primary" name="action" value="save_close" data-close-after-save="true">Сохранить и закрыть</button>
            </div>
            <button type="button" class="btn btn-outline-danger"
                    id="delete-btn"
                    th:data-api-url=@{/api/tasks/{id}(id=${task.id})}
                    onclick="confirmDelete(this)">
                Архивировать
            </button>
        </div>
    </form>

    <div class="card mt-4">
        <div class="card-header">
            <div class="d-flex align-items-center justify-content-between">
                <h5 class="mb-0">Timeline</h5>
                <span class="text-muted small" th:text="${#lists.size(timeline) + ' events'}">0 events</span>
            </div>
        </div>
        <div class="card-body">
            <div th:if="${#lists.isEmpty(timeline)}" class="text-muted">Событий пока нет.</div>
            <div th:unless="${#lists.isEmpty(timeline)}" class="list-group list-group-flush">
                <div th:each="event : ${timeline}" class="list-group-item px-0">
                    <div class="d-flex justify-content-between align-items-start gap-3">
                        <div>
                            <div class="fw-semibold" th:text="${event.summary}">Событие</div>
                            <div class="small text-muted">
                                <span th:text="${event.eventType}">EVENT_TYPE</span>
                                <span th:if="${event.actorType}" th:text="${' · ' + event.actorType}"></span>
                                <span th:if="${event.sourceType}" th:text="${' · ' + event.sourceType}"></span>
                            </div>
                        </div>
                        <div class="small text-muted text-nowrap"
                             th:text="${#temporals.format(event.createdAt.atZone(T(java.time.ZoneId).systemDefault()), 'yyyy-MM-dd HH:mm')}">
                            2026-06-29 15:30
                        </div>
                    </div>
                </div>
            </div>

            <form id="timeline-comment-form" class="mt-3" th:attr="data-task-id=${task.id}">
                <label for="timeline-comment" class="form-label fw-semibold">Комментарий</label>
                <textarea id="timeline-comment" class="form-control" rows="3" placeholder="Добавить комментарий в timeline"></textarea>
                <div class="d-flex justify-content-between align-items-center mt-2">
                    <div id="timeline-comment-status" class="small text-success d-none">Комментарий добавлен</div>
                    <button type="submit" class="btn btn-sm btn-outline-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Hidden delete form -->
    <form id="delete-form" method="post" th:action="@{/ui/tasks/{id}/delete(id=${task.id})}"></form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let saveStatusTimer = null;

// Links preview: extract URLs from textarea, render as clickable links
function updateLinksPreview() {
    const text = document.getElementById('md-input').value;
    const urlRegex = /https?:\/\/[^\s<>"']+/g;
    const matches = text.match(urlRegex) || [];
    const unique = [...new Set(matches)];
    const container = document.getElementById('task-editor-links');
    const list = document.getElementById('task-editor-links-list');
    while (list.firstChild) list.removeChild(list.firstChild);
    if (unique.length === 0) {
        container.classList.add('d-none');
        return;
    }
    unique.forEach(function(url) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = url;
        a.textContent = url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        li.appendChild(a);
        list.appendChild(li);
    });
    container.classList.remove('d-none');
}

// Double-confirm delete
let deleteTimer = null;
function confirmDelete(btn) {
    if (btn.dataset.confirmed === 'true') {
        window.LeaderUiApi.request(btn.dataset.apiUrl, {method: 'DELETE'})
            .then(function(result) {
                window.LeaderUiApi.handleSuccess('redirect:/ui/today', result);
            })
            .catch(function() {});
        return;
    }
    btn.dataset.confirmed = 'true';
    const original = btn.textContent;
    btn.textContent = 'Точно архивировать?';
    btn.classList.replace('btn-outline-danger', 'btn-danger');
    deleteTimer = setTimeout(() => {
        btn.dataset.confirmed = 'false';
        btn.textContent = original;
        btn.classList.replace('btn-danger', 'btn-outline-danger');
    }, 3000);
}

// Wire links preview to textarea changes and initial load
document.addEventListener('DOMContentLoaded', function() {
    updateLinksPreview();
    document.getElementById('md-input').addEventListener('input', updateLinksPreview);
});

// Status radio pill styling
document.querySelectorAll('.status-radio').forEach(radio => {
    radio.addEventListener('change', () => {
        document.querySelectorAll('.status-radio').forEach(r => {
            const pill = r.nextElementSibling;
            if (r.checked) {
                pill.classList.add('is-selected');
            } else {
                pill.classList.remove('is-selected');
            }
        });
    });
});

document.getElementById('task-edit-form').addEventListener('submit', async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const taskId = form.dataset.taskId;
    const submitter = event.submitter;
    const closeAfterSave = submitter && submitter.dataset.closeAfterSave === 'true';
    const saveStatus = document.getElementById('save-status');
    const formData = new FormData(form);
    const metaPayload = {
        title: formData.get('title'),
        priority: formData.get('priority'),
        status: formData.get('status'),
        dueDate: formData.get('dueDate') || null
    };
    const description = formData.get('description') || '';

    try {
        saveStatus.classList.add('d-none');
        saveStatus.textContent = '';
        saveStatus.classList.remove('alert-danger');
        saveStatus.classList.add('alert-success');
        await window.LeaderUiApi.request('/api/tasks/' + taskId, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(metaPayload)
        });

        await window.LeaderUiApi.request('/api/tasks/' + taskId + '/description', {
            method: 'PUT',
            headers: {'Content-Type': 'text/plain'},
            body: description
        });

        if (closeAfterSave) {
            window.LeaderUiApi.handleSuccess('redirect:/ui/today', {response: {status: 200}, data: null});
            return;
        }
        saveStatus.textContent = 'Задача сохранена';
        saveStatus.classList.remove('d-none');
        if (saveStatusTimer) {
            window.clearTimeout(saveStatusTimer);
        }
        saveStatusTimer = window.setTimeout(function () {
            saveStatus.classList.add('d-none');
            saveStatus.textContent = '';
        }, 3000);
    } catch (error) {
        saveStatus.textContent = 'Не удалось сохранить задачу';
        saveStatus.classList.remove('d-none');
        saveStatus.classList.remove('alert-success');
        saveStatus.classList.add('alert-danger');
    }
});

document.getElementById('timeline-comment-form')?.addEventListener('submit', async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const taskId = form.dataset.taskId;
    const textarea = document.getElementById('timeline-comment');
    const status = document.getElementById('timeline-comment-status');
    const text = textarea.value.trim();
    if (!text) return;

    try {
        await window.LeaderUiApi.request('/api/tasks/' + taskId + '/timeline/comment', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text})
        });
        status.classList.remove('d-none');
        window.location.reload();
    } catch (error) {}
});
</script>
</body>
</html>
