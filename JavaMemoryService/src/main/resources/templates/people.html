<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Команда')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Команда и стейкхолдеры</h4>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Добавить человека</button>
    </div>

    <!-- Search -->
    <form method="get" action="/ui/people" class="mb-3 d-flex gap-2">
        <input type="text" name="search" class="form-control form-control-sm" placeholder="Поиск по имени..."
               th:value="${search}"/>
        <button type="submit" class="btn btn-sm btn-outline-secondary">Найти</button>
        <a href="/ui/people" class="btn btn-sm btn-outline-danger">×</a>
    </form>

    <div th:if="${#lists.isEmpty(people)}" class="text-muted">Никого нет</div>

    <div th:each="person : ${people}" class="card mb-4" th:id="'person-' + ${person.id}">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h6 class="card-title mb-1" th:text="${person.fullName}"></h6>
                    <div class="text-muted small">
                        <span th:if="${person.login}" th:text="'@' + ${person.login} + ' '"></span>
                        <span th:if="${person.email}" th:text="${person.email} + ' '"></span>
                        <span th:if="${person.domain}" class="badge bg-secondary" th:text="${person.domain}"></span>
                    </div>
                    <div th:if="${person.currentTask}" class="small mt-1">
                        <span class="fw-semibold">Сейчас:</span>
                        <span th:text="${person.currentTask}"></span>
                    </div>
                </div>
                <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal"
                        th:attr="data-bs-target='#edit-' + ${person.id}">Edit</button>
            </div>

            <!-- Notes -->
            <div>
                <div th:each="note : ${notesByPerson[person.id]}" class="border-start border-3 border-secondary ps-2 mt-2 small">
                    <span th:text="${note.note}"></span>
                    <span th:if="${note.tags}" class="text-muted ms-1">[<span th:text="${note.tags}"></span>]</span>
                    <span class="text-muted ms-1" th:text="${#temporals.format(note.createdAt, 'dd.MM HH:mm')}"></span>
                </div>
            </div>

            <!-- Add note form -->
            <form method="post" th:action="@{/ui/people/{id}/note(id=${person.id})}" class="mt-2 d-flex gap-2"
                  th:attr="data-api-url=@{/api/people/{id}/notes(id=${person.id})},data-api-method='POST',data-api-success='reload'">
                <input type="text" name="note" class="form-control form-control-sm" placeholder="Заметка..."/>
                <input type="text" name="tags" class="form-control form-control-sm" placeholder="теги" style="max-width:120px"/>
                <button type="submit" class="btn btn-sm btn-outline-primary">+</button>
            </form>
        </div>
    </div>

    <!-- Edit modals -->
    <div th:each="person : ${people}">
        <div class="modal fade" th:id="'edit-' + ${person.id}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit: <span th:text="${person.fullName}"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form method="post" th:action="@{/ui/people/{id}/edit(id=${person.id})}"
                          th:attr="data-api-url=@{/api/people/{id}(id=${person.id})},data-api-method='PUT',data-api-success='reload'">
                        <input type="hidden" name="_method" value="PUT">
                        <div class="modal-body">
                            <div class="mb-2">
                                <label class="form-label">ФИО</label>
                                <input type="text" name="fullName" class="form-control" th:value="${person.fullName}" required/>
                            </div>
                            <div class="row mb-2">
                                <div class="col">
                                    <label class="form-label">Логин</label>
                                    <input type="text" name="login" class="form-control" th:value="${person.login}"/>
                                </div>
                                <div class="col">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" class="form-control" th:value="${person.email}"/>
                                </div>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Домен / роль</label>
                                <input type="text" name="domain" class="form-control" th:value="${person.domain}"/>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Текущая задача</label>
                                <input type="text" name="currentTask" class="form-control" th:value="${person.currentTask}"/>
                            </div>
                            <div class="mb-2">
                                <label class="form-label">Заметки</label>
                                <textarea name="notes" class="form-control" rows="3" th:text="${person.notes}"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add person modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Добавить человека</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" action="/ui/people/add"
                  data-api-url="/api/people" data-api-method="POST" data-api-success="reload">
                <div class="modal-body">
                    <div class="mb-2">
                        <label class="form-label">ФИО *</label>
                        <input type="text" name="fullName" class="form-control" required/>
                    </div>
                    <div class="row mb-2">
                        <div class="col">
                            <label class="form-label">Логин</label>
                            <input type="text" name="login" class="form-control"/>
                        </div>
                        <div class="col">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control"/>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label">Домен / роль</label>
                        <input type="text" name="domain" class="form-control"/>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('edit');
    if (!editId) {
        return;
    }
    const modalElement = document.getElementById('edit-' + editId);
    if (!modalElement) {
        return;
    }
    const modal = bootstrap.Modal.getOrCreateInstance(modalElement);
    modal.show();
})();
</script>
</body>
</html>
