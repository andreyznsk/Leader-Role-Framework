<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Сегодня')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">

    <!-- Summary cards -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="card text-center border-primary">
                <div class="card-body py-2">
                    <div class="fs-3 fw-bold text-primary" th:text="${todayTasksCount}">0</div>
                    <div class="small text-muted">Задач сегодня</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center border-warning">
                <div class="card-body py-2">
                    <div class="fs-3 fw-bold text-warning" th:text="${pendingCount}">0</div>
                    <div class="small text-muted">Ожидают подтв.</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center border-danger">
                <div class="card-body py-2">
                    <div class="fs-3 fw-bold text-danger" th:text="${openIncidentsCount}">0</div>
                    <div class="small text-muted">Открытых инц.</div>
                </div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="card text-center border-success">
                <div class="card-body py-2">
                    <div class="fs-3 fw-bold text-success" th:text="${doneTodayCount}">0</div>
                    <div class="small text-muted">Выполнено</div>
                </div>
            </div>
        </div>
    </div>

    <!-- PENDING section -->
    <div th:if="${!#lists.isEmpty(pending)}" class="alert alert-warning mb-4">
        <h5 class="alert-heading">Ожидают подтверждения (<span th:text="${#lists.size(pending)}"></span>)</h5>
        <div th:each="task : ${pending}" class="border rounded p-3 mb-2 bg-white">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="badge bg-secondary me-1" th:if="${task.emailId != null}">EMAIL</span>
                    <strong th:text="${task.title}"></strong>
                    <span class="badge ms-2"
                          th:classappend="${task.priority == 'HIGH' or task.priority == 'CRITICAL'} ? 'bg-danger' : 'bg-secondary'"
                          th:text="${task.priority}"></span>
                    <div th:if="${task.description}" class="text-muted small mt-1" th:text="${task.description}"></div>
                </div>
                <div class="d-flex ms-3">
                    <form method="post" th:action="@{/ui/tasks/{id}/confirm(id=${task.id})}">
                        <button class="btn btn-sm btn-success me-1">Принять</button>
                    </form>
                    <form method="post" th:action="@{/ui/tasks/{id}/reject(id=${task.id})}">
                        <button class="btn btn-sm btn-outline-danger">Отклонить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Today plan -->
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0">План на сегодня
                <span class="text-muted fw-normal small" th:text="${#temporals.format(today, 'dd.MM.yyyy')}"></span>
            </h5>
            <small class="text-muted">🚨&nbsp;CRITICAL &nbsp;🔴&nbsp;HIGH &nbsp;🔵&nbsp;NORMAL &nbsp;⚪&nbsp;LOW</small>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(todayTasks)}" class="text-muted p-3">Задач нет</div>
            <div id="today-list">
                <div th:each="task : ${todayTasks}"
                     th:data-id="${task.id}"
                     class="d-flex align-items-center border-bottom px-3 py-2 task-row">

                    <!-- Drag handle -->
                    <span class="drag-handle text-muted me-2" style="cursor:grab;user-select:none">⠿</span>

                    <!-- Done checkbox -->
                    <form method="post" th:action="@{/ui/tasks/{id}/done(id=${task.id})}" class="me-2">
                        <button type="submit"
                                class="btn btn-sm p-0 border-0"
                                th:title="${task.status == 'DONE'} ? 'Снять отметку' : 'Выполнено'">
                            <span th:text="${task.status == 'DONE'} ? '☑' : '☐'" style="font-size:1.2rem"></span>
                        </button>
                    </form>

                    <!-- Priority flag -->
                    <button type="button" class="btn btn-sm p-0 border-0 me-2"
                            th:data-id="${task.id}"
                            th:data-next-priority="${task.priority == 'NORMAL'} ? 'HIGH' : (${task.priority == 'HIGH'} ? 'CRITICAL' : (${task.priority == 'CRITICAL'} ? 'LOW' : 'NORMAL'))"
                            th:title="'Приоритет: ' + ${task.priority}"
                            onclick="togglePriority(this)">
                        <span th:text="${task.priority == 'CRITICAL'} ? '🚨' : (${task.priority == 'HIGH'} ? '🔴' : (${task.priority == 'LOW'} ? '⚪' : '🔵'))"></span>
                    </button>

                    <!-- Title -->
                    <span class="flex-grow-1"
                          th:text="${task.title}"
                          th:classappend="${task.status == 'DONE'} ? 'text-decoration-line-through text-muted' : ''"></span>

                    <!-- Status badge -->
                    <span class="badge me-2 flex-shrink-0"
                          th:classappend="${task.status == 'DONE'} ? 'bg-success' : (${task.status == 'IN_PROGRESS'} ? 'bg-primary' : (${task.status == 'BLOCKED'} ? 'bg-danger' : 'bg-secondary'))"
                          th:text="${task.status}"></span>

                    <!-- Actions -->
                    <div class="d-flex gap-1 ms-1">
                        <!-- Reorder up -->
                        <form method="post" th:action="@{/ui/tasks/{id}/reorder-up(id=${task.id})}">
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" title="Вверх">↑</button>
                        </form>
                        <!-- Reorder down -->
                        <form method="post" th:action="@{/ui/tasks/{id}/reorder-down(id=${task.id})}">
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" title="Вниз">↓</button>
                        </form>
                        <!-- Edit -->
                        <a th:href="@{/ui/tasks/{id}/edit(id=${task.id})}"
                           class="btn btn-sm btn-outline-primary py-0 px-1" title="Редактировать">✏</a>
                        <!-- Move to tomorrow -->
                        <form method="post" th:action="@{/ui/tasks/{id}/move(id=${task.id})}">
                            <input type="hidden" name="toDate" th:value="${#temporals.format(tomorrow, 'yyyy-MM-dd')}"/>
                            <button class="btn btn-sm btn-outline-secondary py-0 px-1" title="На завтра">→</button>
                        </form>
                        <!-- Delete -->
                        <form method="post" th:action="@{/ui/tasks/{id}/delete(id=${task.id})}">
                            <button class="btn btn-sm btn-outline-danger py-0 px-1" title="Удалить">×</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Add task inline form -->
            <div class="px-3 py-2 border-top">
                <button class="btn btn-sm btn-outline-secondary" type="button"
                        data-bs-toggle="collapse" data-bs-target="#add-task-form">
                    + Добавить задачу
                </button>
                <div class="collapse mt-2" id="add-task-form">
                    <form method="post" action="/ui/tasks/add" class="row g-2">
                        <div class="col-md-6">
                            <input type="text" name="title" class="form-control form-control-sm"
                                   placeholder="Название задачи..." required/>
                        </div>
                        <div class="col-md-3">
                            <select name="priority" class="form-select form-select-sm">
                                <option value="LOW">LOW</option>
                                <option value="NORMAL" selected>NORMAL</option>
                                <option value="HIGH">HIGH</option>
                                <option value="CRITICAL">CRITICAL</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-sm btn-primary w-100">Добавить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Tomorrow -->
    <div class="card mb-4">
        <div class="card-header">
            <h5 class="mb-0">Завтра
                <span class="text-muted fw-normal small" th:text="${#temporals.format(tomorrow, 'dd.MM.yyyy')}"></span>
            </h5>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(tomorrowTasks)}" class="text-muted p-3">Задач нет</div>
            <div th:each="task : ${tomorrowTasks}" class="d-flex align-items-center border-bottom px-3 py-2">
                <span class="badge bg-secondary me-2 flex-shrink-0" th:text="${task.status}"></span>
                <span class="flex-grow-1" th:text="${task.title}"></span>
                <span class="badge border text-dark small me-2" th:text="${task.priority}"></span>
                <div class="d-flex gap-1">
                    <a th:href="@{/ui/tasks/{id}/edit(id=${task.id})}"
                       class="btn btn-sm btn-outline-primary py-0 px-1" title="Редактировать">✏</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Drag-and-drop reorder
(function () {
    const list = document.getElementById('today-list');
    if (!list) return;
    function togglePriority(btn) {
        fetch('/api/tasks/' + btn.dataset.id, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({priority: btn.dataset.nextPriority})
        }).then(() => location.reload());
    }
    window.togglePriority = togglePriority;

    let dragged = null;

    list.querySelectorAll('.drag-handle').forEach(handle => {
        handle.addEventListener('mousedown', () => {
            handle.closest('.task-row').setAttribute('draggable', 'true');
        });
        handle.addEventListener('mouseup', () => {
            handle.closest('.task-row').setAttribute('draggable', 'false');
        });
    });

    list.addEventListener('dragstart', e => {
        dragged = e.target.closest('.task-row');
        e.dataTransfer.effectAllowed = 'move';
    });
    list.addEventListener('dragover', e => {
        e.preventDefault();
        const row = e.target.closest('.task-row');
        if (row && row !== dragged) row.classList.add('bg-light');
    });
    list.addEventListener('dragleave', e => {
        const row = e.target.closest('.task-row');
        if (row) row.classList.remove('bg-light');
    });
    list.addEventListener('drop', e => {
        e.preventDefault();
        const target = e.target.closest('.task-row');
        if (!target || target === dragged) return;
        target.classList.remove('bg-light');
        const rows = [...list.querySelectorAll('.task-row')];
        const newPos = rows.indexOf(target);
        const id = dragged.dataset.id;
        fetch('/api/tasks/' + id + '/reorder', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({position: newPos})
        }).then(() => location.reload());
    });
})();
</script>
</body>
</html>
