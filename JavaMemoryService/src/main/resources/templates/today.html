<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('План дня')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container los-page-content">

    <!-- Summary stats -->
    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="los-stat">
                <div class="los-stat-num" style="color:var(--accent2)" th:text="${currentTasksCount}">0</div>
                <div class="los-stat-label">Текущих задач</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="los-stat">
                <div class="los-stat-num" style="color:var(--accent3)" th:text="${pendingCount}">0</div>
                <div class="los-stat-label">Ожидают подтв.</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="los-stat">
                <div class="los-stat-num" style="color:var(--accent3)" th:text="${openIncidentsCount}">0</div>
                <div class="los-stat-label">Открытых инц.</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="los-stat">
                <div class="los-stat-num" style="color:var(--accent)" th:text="${doneTodayCount}">0</div>
                <div class="los-stat-label">Выполнено</div>
            </div>
        </div>
    </div>

    <!-- PENDING section -->
    <div th:if="${!#lists.isEmpty(pending)}" class="mb-4">
        <div class="los-pending-title">Ожидают подтверждения (<span th:text="${#lists.size(pending)}"></span>)</div>
        <div th:each="task : ${pending}" class="los-pending-card">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="badge bg-secondary me-1" th:if="${task.emailId != null}">EMAIL</span>
                    <a class="task-title-clickable fw-semibold"
                       th:href="@{/ui/tasks/{id}/edit(id=${task.id})}"
                       th:text="${task.title}"></a>
                    <span class="badge ms-2"
                          th:classappend="${task.priority == 'HIGH' or task.priority == 'CRITICAL'} ? 'bg-danger' : 'bg-secondary'"
                          th:text="${task.priority}"></span>
                    <div th:if="${task.description}" class="text-muted small mt-1" th:text="${task.description}"></div>
                </div>
                <div class="d-flex gap-1 ms-3 flex-shrink-0">
                    <form method="post" th:action="@{/ui/tasks/{id}/confirm(id=${task.id})}"
                          th:attr="data-api-url=@{/api/tasks/{id}/confirm(id=${task.id})},data-api-method='POST',data-api-success='reload'">
                        <button class="btn btn-sm btn-success">Принять</button>
                    </form>
                    <a th:href="@{/ui/tasks/{id}/edit(id=${task.id})}"
                       class="btn btn-sm btn-outline-secondary">Изменить</a>
                    <form method="post" th:action="@{/ui/tasks/{id}/reject(id=${task.id})}"
                          th:attr="data-api-url=@{/api/tasks/{id}/reject(id=${task.id})},data-api-method='POST',data-api-success='reload'">
                        <button class="btn btn-sm btn-outline-danger">Отклонить</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Current tasks -->
    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0" style="font-family:var(--mono);font-size:13px;text-transform:uppercase;letter-spacing:.08em">
                Текущие задачи
            </h5>
            <small class="text-muted">🚨&nbsp;CRITICAL &nbsp;🔴&nbsp;HIGH &nbsp;🔵&nbsp;NORMAL &nbsp;⚪&nbsp;LOW</small>
        </div>
        <div class="card-body border-bottom">
            <form method="get" th:action="@{/ui/today}" class="row g-2 align-items-end" id="today-filters-form">
                <input type="hidden" name="sortBy" th:value="${sortBy}"/>
                <input type="hidden" name="sortDir" th:value="${sortDir}"/>
                <div class="col-sm-6 col-md-4 col-lg-3">
                    <label for="priorityFilter" class="form-label mb-1 d-flex align-items-center justify-content-between gap-2">
                        <span>Приоритет</span>
                        <span class="d-inline-flex gap-1">
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1"
                                    th:classappend="${sortBy == 'priority' and sortDir == 'asc'} ? ' active'"
                                    title="Сортировать по приоритету вверх"
                                    onclick="submitSort('priority', 'asc')">↑</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1"
                                    th:classappend="${sortBy == 'priority' and sortDir == 'desc'} ? ' active'"
                                    title="Сортировать по приоритету вниз"
                                    onclick="submitSort('priority', 'desc')">↓</button>
                        </span>
                    </label>
                    <select id="priorityFilter" name="priority" class="form-select form-select-sm">
                        <option value="">Все</option>
                        <option th:each="option : ${priorityOptions}"
                                th:value="${option}"
                                th:text="${option}"
                                th:selected="${priorityFilter == option}"></option>
                    </select>
                </div>
                <div class="col-sm-6 col-md-4 col-lg-3">
                    <label for="statusFilter" class="form-label mb-1 d-flex align-items-center justify-content-between gap-2">
                        <span>Статус</span>
                        <span class="d-inline-flex gap-1">
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1"
                                    th:classappend="${sortBy == 'status' and sortDir == 'asc'} ? ' active'"
                                    title="Сортировать по статусу вверх"
                                    onclick="submitSort('status', 'asc')">↑</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1"
                                    th:classappend="${sortBy == 'status' and sortDir == 'desc'} ? ' active'"
                                    title="Сортировать по статусу вниз"
                                    onclick="submitSort('status', 'desc')">↓</button>
                        </span>
                    </label>
                    <select id="statusFilter" name="status" class="form-select form-select-sm">
                        <option value="">Все</option>
                        <option th:each="option : ${statusOptions}"
                                th:value="${option}"
                                th:text="${option}"
                                th:selected="${statusFilter == option}"></option>
                    </select>
                </div>
                <div class="col-sm-6 col-md-4 col-lg-3">
                    <label for="dueDateFilter" class="form-label mb-1 d-flex align-items-center justify-content-between gap-2">
                        <span>Дедлайн</span>
                        <span class="d-inline-flex gap-1">
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1"
                                    th:classappend="${sortBy == 'dueDate' and sortDir == 'asc'} ? ' active'"
                                    title="Сортировать по дедлайну вверх"
                                    onclick="submitSort('dueDate', 'asc')">↑</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1"
                                    th:classappend="${sortBy == 'dueDate' and sortDir == 'desc'} ? ' active'"
                                    title="Сортировать по дедлайну вниз"
                                    onclick="submitSort('dueDate', 'desc')">↓</button>
                        </span>
                    </label>
                    <input id="dueDateFilter" type="date" name="dueDate" class="form-control form-control-sm"
                           th:value="${dueDateFilter}"/>
                </div>
                <div class="col-sm-12 col-md-auto">
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-primary">Применить</button>
                        <a th:href="@{/ui/today}" class="btn btn-sm btn-outline-secondary">Сбросить</a>
                        <button type="button" class="btn btn-sm btn-success los-add-task-btn"
                                data-bs-toggle="modal" data-bs-target="#addTaskModal">
                            <span>Добавить</span>
                            <span>задачу</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(currentTasks)}" class="text-muted p-3">Задач нет</div>
            <div id="today-list">
                <div th:each="task : ${currentTasks}"
                     th:data-id="${task.id}"
                     class="d-flex align-items-center border-bottom px-3 py-2 task-row">

                    <!-- Done checkbox -->
                    <form method="post" th:action="@{/ui/tasks/{id}/toggle-done(id=${task.id})}" class="me-2"
                          th:attr="data-api-url=@{/api/tasks/{id}/toggle-done(id=${task.id})},data-api-method='POST',data-api-success='reload'">
                        <button type="submit"
                                class="btn btn-sm p-0 border-0"
                                th:title="${task.status == 'DONE'} ? 'Снять отметку' : 'Выполнено'">
                            <span th:text="${task.status == 'DONE'} ? '☑' : '☐'" style="font-size:1.2rem"></span>
                        </button>
                    </form>

                    <!-- Priority flag -->
                    <button type="button" class="btn btn-sm p-0 border-0 me-2"
                            th:data-id="${task.id}"
                            th:data-next-priority="${task.priority == 'NORMAL'} ? 'HIGH' : (${task.priority == 'HIGH'} ? 'CRITICAL' : (${task.priority == 'CRITICAL'} ? 'LOW' : 'NORMAL'))"
                            th:title="'Приоритет: ' + ${task.priority}"
                            onclick="togglePriority(this)">
                        <span th:text="${task.priority == 'CRITICAL'} ? '🚨' : (${task.priority == 'HIGH'} ? '🔴' : (${task.priority == 'LOW'} ? '⚪' : '🔵'))"></span>
                    </button>

                    <!-- Title -->
                    <span class="flex-grow-1">
                        <a class="task-title-clickable"
                           th:href="@{/ui/tasks/{id}/edit(id=${task.id})}"
                           th:text="${task.title}"
                           th:classappend="${task.status == 'DONE'} ? 'text-decoration-line-through text-muted' : ''"></a>
                    </span>

                    <!-- Deadline -->
                    <span class="task-deadline me-2 flex-shrink-0"
                          th:classappend="${task.dueDate != null and task.dueDate.isBefore(today)} ? ' task-deadline-overdue' : ''">
                        <span class="text-muted small">DL</span>
                        <span th:text="${task.dueDate != null ? #temporals.format(task.dueDate, 'dd.MM.yyyy') : '—'}">—</span>
                    </span>

                    <!-- Status badge -->
                    <button type="button"
                            class="btn btn-sm p-0 border-0 bg-transparent me-2 flex-shrink-0"
                            th:attr="data-id=${task.id},data-status=${task.status},title='Сменить статус'"
                            onclick="toggleStatus(this)">
                        <span class="badge"
                              th:classappend="${task.status == 'DONE'} ? 'bg-success' : (${task.status == 'IN_PROGRESS'} ? 'bg-primary' : (${task.status == 'BLOCKED'} ? 'bg-danger' : 'bg-secondary'))"
                              th:text="${task.status}"></span>
                    </button>

                    <!-- Actions -->
                    <div class="d-flex gap-1 ms-1">
                        <button type="button"
                                class="btn btn-sm btn-outline-secondary py-0 px-2"
                                title="Сдвинуть дедлайн на +1 день"
                                th:attr="data-id=${task.id},data-current-due-date=${task.dueDate},data-base-date=${task.dueDate != null ? task.dueDate : today}"
                                onclick="moveTaskToTomorrow(this.dataset.id, this.dataset.baseDate)">
                            Завтра
                        </button>
                        <button type="button"
                                class="btn btn-sm btn-outline-danger py-0 px-1"
                                title="Удалить"
                                th:attr="data-id=${task.id},data-title=${task.title}"
                                onclick="openDeleteTaskModal(this.dataset.id, this.dataset.title)">×</button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addTaskModalLabel">Новая задача</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="add-task-modal-form"
                      data-api-url="/api/tasks"
                      data-api-method="POST"
                      data-api-success="reload"
                      data-api-custom-handler="true">
                    <input type="hidden" name="date" th:value="${#temporals.format(today, 'yyyy-MM-dd')}"/>
                    <input type="hidden" name="source" value="MANUAL"/>

                    <div class="mb-3">
                        <label for="newTaskTitle" class="form-label fw-semibold">Название</label>
                        <input id="newTaskTitle" type="text" name="title" class="form-control" required/>
                    </div>

                    <div class="mb-3">
                        <label for="newTaskDescription" class="form-label fw-semibold">Описание</label>
                        <textarea id="newTaskDescription" name="description" class="form-control" rows="6"></textarea>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="newTaskPriority" class="form-label fw-semibold">Приоритет</label>
                            <select id="newTaskPriority" name="priority" class="form-select">
                                <option value="LOW">LOW</option>
                                <option value="NORMAL" selected>NORMAL</option>
                                <option value="HIGH">HIGH</option>
                                <option value="CRITICAL">CRITICAL</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="newTaskStatus" class="form-label fw-semibold">Статус</label>
                            <select id="newTaskStatus" name="status" class="form-select">
                                <option value="TODO" selected>TODO</option>
                                <option value="IN_PROGRESS">IN_PROGRESS</option>
                                <option value="BLOCKED">BLOCKED</option>
                                <option value="DONE">DONE</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="newTaskDueDate" class="form-label fw-semibold">Дедлайн</label>
                            <input id="newTaskDueDate" type="date" name="dueDate" class="form-control"
                                   th:value="${#temporals.format(today, 'yyyy-MM-dd')}"/>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="submit" form="add-task-modal-form" class="btn btn-success">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteTaskModal" tabindex="-1" aria-labelledby="deleteTaskModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deleteTaskModalLabel">Удалить задачу</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-2">Задача будет удалена из списка.</div>
                <div class="small text-muted">Markdown-файл описания тоже будет удалён.</div>
                <div class="mt-3 fw-semibold" id="deleteTaskModalTitle"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirmDeleteTaskButton">Удалить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
let deleteTaskModalInstance = null;
let deleteTaskId = null;

function togglePriority(btn) {
    window.LeaderUiApi.request('/api/tasks/' + btn.dataset.id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({priority: btn.dataset.nextPriority})
    }).then(() => reloadTodayKeepingFilters());
}

function toggleStatus(btn) {
    const nextStatus = nextTaskStatus(btn.dataset.status);
    window.LeaderUiApi.request('/api/tasks/' + btn.dataset.id + '/status', {
        method: 'PATCH',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({status: nextStatus})
    }).then(() => reloadTodayKeepingFilters());
}

function moveTaskToTomorrow(id, baseDate) {
    const nextDate = shiftIsoDate(baseDate, 1);
    window.LeaderUiApi.request('/api/tasks/' + id, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({dueDate: nextDate})
    }).then(() => reloadTodayKeepingFilters());
}

function nextTaskStatus(status) {
    switch (status) {
        case 'TODO':
            return 'IN_PROGRESS';
        case 'IN_PROGRESS':
            return 'BLOCKED';
        case 'BLOCKED':
            return 'TODO';
        case 'DONE':
        default:
            return 'TODO';
    }
}

function reloadTodayKeepingFilters() {
    const currentUrl = new URL(window.location.href);
    window.location.href = currentUrl.toString();
}

function shiftIsoDate(isoDate, days) {
    const [year, month, day] = isoDate.split('-').map(Number);
    const date = new Date(Date.UTC(year, month - 1, day));
    date.setUTCDate(date.getUTCDate() + days);
    const nextYear = date.getUTCFullYear();
    const nextMonth = String(date.getUTCMonth() + 1).padStart(2, '0');
    const nextDay = String(date.getUTCDate()).padStart(2, '0');
    return `${nextYear}-${nextMonth}-${nextDay}`;
}

function submitSort(sortBy, sortDir) {
    const form = document.getElementById('today-filters-form');
    if (!form) return;
    form.querySelector('input[name="sortBy"]').value = sortBy;
    form.querySelector('input[name="sortDir"]').value = sortDir;
    form.requestSubmit();
}

function openDeleteTaskModal(id, title) {
    deleteTaskId = id;
    document.getElementById('deleteTaskModalTitle').textContent = title || '';
    const modalEl = document.getElementById('deleteTaskModal');
    deleteTaskModalInstance = deleteTaskModalInstance || new bootstrap.Modal(modalEl);
    deleteTaskModalInstance.show();
}

document.getElementById('add-task-modal-form')?.addEventListener('submit', async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    const formData = new FormData(form);
    const payload = {
        title: formData.get('title'),
        description: formData.get('description') || '',
        priority: formData.get('priority'),
        status: formData.get('status'),
        dueDate: formData.get('dueDate') || null,
        date: formData.get('date'),
        source: formData.get('source')
    };

    try {
        const createResult = await window.LeaderUiApi.request('/api/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (payload.description && createResult?.data?.id) {
            await window.LeaderUiApi.request('/api/tasks/' + createResult.data.id + '/description', {
                method: 'PUT',
                headers: {'Content-Type': 'text/plain'},
                body: payload.description
            });
        }

        window.LeaderUiApi.handleSuccess('reload', createResult);
    } catch (error) {}
});

document.getElementById('confirmDeleteTaskButton')?.addEventListener('click', async function () {
    if (!deleteTaskId) return;
    try {
        const result = await window.LeaderUiApi.request('/api/tasks/' + deleteTaskId, {
            method: 'DELETE'
        });
        if (deleteTaskModalInstance) {
            deleteTaskModalInstance.hide();
        }
        deleteTaskId = null;
        window.LeaderUiApi.handleSuccess('reload', result);
    } catch (error) {}
});
</script>
</body>
</html>
