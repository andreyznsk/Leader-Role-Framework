<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — LeaderOS'">LeaderOS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<nav th:fragment="nav" class="los-navbar">
    <a class="los-brand" href="/ui/today">
        <div class="los-dot"></div>
        <span class="los-title">Leader<span class="los-accent">OS</span></span>
    </a>
    <div class="los-links">
        <a href="/ui/today">📅 План дня</a>
        <a href="/ui/notes">📝 Заметки</a>
        <a href="/ui/incidents">🚨 Инциденты</a>
        <a href="/ui/risks">⚠️ Риски</a>
        <a href="/ui/people">👥 Команда</a>
        <a href="/ui/presentation" target="_blank">🚀 Презентация</a>
    </div>
    <script>
        document.querySelectorAll('.los-links a').forEach(function(a) {
            if (a.target === '_blank') return;
            if (window.location.pathname === a.getAttribute('href') ||
                window.location.pathname.startsWith(a.getAttribute('href') + '/')) {
                a.classList.add('active');
            }
        });
    </script>
</nav>
</body>
</html>
