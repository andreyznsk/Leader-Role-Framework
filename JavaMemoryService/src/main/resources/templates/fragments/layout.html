<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <script>
        (function () {
            try {
                if (window.localStorage.getItem('leaderos.sidebar.collapsed') === 'true') {
                    document.documentElement.classList.add('los-collapsed');
                }
            } catch (ignored) {
            }
        })();
    </script>
    <title th:text="${title} + ' — LeaderOS'">LeaderOS</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" th:href="@{/style.css}"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<th:block th:fragment="sidebar">
<div class="los-mobile-topbar">
    <button type="button" class="los-mobile-toggle" id="los-mobile-toggle"
            aria-label="Открыть меню" aria-expanded="false" aria-controls="los-sidebar">
        <span class="los-mobile-toggle-icon">&#9776;</span>
    </button>
    <a class="los-brand los-mobile-brand" href="/ui/today">
        <div class="los-dot"></div>
        <span class="los-title">Leader<span class="los-accent">OS</span></span>
    </a>
</div>
<div class="los-sidebar-backdrop" id="los-sidebar-backdrop"></div>
<nav class="los-sidebar" id="los-sidebar" data-testid="leaderos-sidebar">
    <div class="los-sidebar-header">
        <a class="los-brand" href="/ui/today">
            <div class="los-dot"></div>
            <span class="los-title">Leader<span class="los-accent">OS</span></span>
        </a>
        <button type="button" class="los-collapse-btn" id="los-collapse-btn"
                aria-label="Свернуть меню" aria-expanded="true" title="Свернуть / развернуть меню">
            <span class="los-collapse-btn-icon">&#8249;</span>
        </button>
    </div>
    <div class="los-sidebar-nav">
        <div class="los-nav-group" data-group-key="operational">
            <button type="button" class="los-nav-group-label" aria-expanded="true">
                <span class="los-nav-group-label-text">Операционная работа</span>
                <span class="los-nav-group-toggle-icon">&#8964;</span>
            </button>
            <div class="los-nav-group-items">
            <a href="/ui/today" class="los-nav-item" data-nav-title="Today">
                <span class="los-nav-icon">&#128203;</span>
                <span class="los-nav-label">Today</span>
                <span th:if="${pendingCount != null and pendingCount > 0}" class="los-nav-alert-dot"
                      th:title="|Есть pending задачи: ${pendingCount}|"></span>
            </a>
            <a href="/ui/intake" class="los-nav-item" data-nav-title="Intake Gateway">
                <span class="los-nav-icon">&#128229;</span>
                <span class="los-nav-label">Intake Gateway</span>
                <span th:if="${newIntakeCount != null and newIntakeCount > 0}" class="los-nav-alert-dot"
                      th:title="|Есть новые intake items: ${newIntakeCount}|"></span>
            </a>
            <a href="/ui/notes" class="los-nav-item" data-nav-title="Notes">
                <span class="los-nav-icon">&#128220;</span>
                <span class="los-nav-label">Notes</span>
            </a>
            <a href="/ui/captures" class="los-nav-item" data-nav-title="Capture Inbox">
                <span class="los-nav-icon">&#128228;</span>
                <span class="los-nav-label">Capture Inbox</span>
            </a>
            </div>
        </div>
        <div class="los-nav-group" data-group-key="context-risks">
            <button type="button" class="los-nav-group-label" aria-expanded="true">
                <span class="los-nav-group-label-text">Контекст и риски</span>
                <span class="los-nav-group-toggle-icon">&#8964;</span>
            </button>
            <div class="los-nav-group-items">
            <a href="/ui/people" class="los-nav-item" data-nav-title="People">
                <span class="los-nav-icon">&#128101;</span>
                <span class="los-nav-label">People</span>
            </a>
            <a href="/ui/risks" class="los-nav-item" data-nav-title="Risks">
                <span class="los-nav-icon">&#9888;</span>
                <span class="los-nav-label">Risks</span>
            </a>
            <a href="/ui/incidents" class="los-nav-item" data-nav-title="Incidents">
                <span class="los-nav-icon">&#128293;</span>
                <span class="los-nav-label">Incidents</span>
            </a>
            </div>
        </div>
        <div class="los-nav-group" data-group-key="knowledge">
            <button type="button" class="los-nav-group-label" aria-expanded="true">
                <span class="los-nav-group-label-text">Знания</span>
                <span class="los-nav-group-toggle-icon">&#8964;</span>
            </button>
            <div class="los-nav-group-items">
            <a href="/ui/search" class="los-nav-item" data-nav-title="Global Search">
                <span class="los-nav-icon">&#128269;</span>
                <span class="los-nav-label">Global Search</span>
            </a>
            <a href="/ui/knowledge" class="los-nav-item" data-nav-title="Knowledge">
                <span class="los-nav-icon">&#128218;</span>
                <span class="los-nav-label">Knowledge</span>
            </a>
            </div>
        </div>
        <div class="los-nav-group" data-group-key="automation">
            <button type="button" class="los-nav-group-label" aria-expanded="true">
                <span class="los-nav-group-label-text">Автоматизация</span>
                <span class="los-nav-group-toggle-icon">&#8964;</span>
            </button>
            <div class="los-nav-group-items">
            <a href="/ui/agent-workspace" class="los-nav-item" data-nav-title="Agent Workspace">
                <span class="los-nav-icon">&#129302;</span>
                <span class="los-nav-label">Agent Workspace</span>
            </a>
            <a href="/ui/settings" class="los-nav-item" data-nav-title="Control Plane">
                <span class="los-nav-icon">&#9881;</span>
                <span class="los-nav-label">Control Plane</span>
            </a>
            <a href="/ui/stats" class="los-nav-item" data-nav-title="Usage Stats">
                <span class="los-nav-icon">&#128200;</span>
                <span class="los-nav-label">Usage Stats</span>
            </a>
            </div>
        </div>
        <div class="los-nav-group" data-group-key="system">
            <button type="button" class="los-nav-group-label" aria-expanded="true">
                <span class="los-nav-group-label-text">Система</span>
                <span class="los-nav-group-toggle-icon">&#8964;</span>
            </button>
            <div class="los-nav-group-items">
            <a href="/ui/presentation" target="_blank" class="los-nav-item" data-nav-title="Presentation">
                <span class="los-nav-icon">&#128421;</span>
                <span class="los-nav-label">Presentation</span>
            </a>
            </div>
        </div>
    </div>
</nav>
<script>
    (function () {
        var COLLAPSE_KEY = 'leaderos.sidebar.collapsed';
        var html = document.documentElement;
        var collapseBtn = document.getElementById('los-collapse-btn');
        var mobileToggle = document.getElementById('los-mobile-toggle');
        var backdrop = document.getElementById('los-sidebar-backdrop');

        function setCollapsed(collapsed) {
            html.classList.toggle('los-collapsed', collapsed);
            if (collapseBtn) collapseBtn.setAttribute('aria-expanded', String(!collapsed));
            try {
                window.localStorage.setItem(COLLAPSE_KEY, collapsed ? 'true' : 'false');
            } catch (ignored) {
            }
        }

        if (collapseBtn) {
            collapseBtn.setAttribute('aria-expanded', String(!html.classList.contains('los-collapsed')));
            collapseBtn.addEventListener('click', function () {
                setCollapsed(!html.classList.contains('los-collapsed'));
            });
        }

        function setMobileOpen(open) {
            html.classList.toggle('los-mobile-open', open);
            if (mobileToggle) mobileToggle.setAttribute('aria-expanded', String(open));
        }

        if (mobileToggle) {
            mobileToggle.addEventListener('click', function () {
                setMobileOpen(!html.classList.contains('los-mobile-open'));
            });
        }

        if (backdrop) {
            backdrop.addEventListener('click', function () {
                setMobileOpen(false);
            });
        }

        var GROUPS_KEY = 'leaderos.sidebar.collapsedGroups';

        function getCollapsedGroups() {
            try {
                var raw = window.localStorage.getItem(GROUPS_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (ignored) {
                return [];
            }
        }

        function setGroupCollapsed(groupEl, collapsed) {
            groupEl.classList.toggle('is-collapsed', collapsed);
            var label = groupEl.querySelector('.los-nav-group-label');
            if (label) label.setAttribute('aria-expanded', String(!collapsed));
        }

        var collapsedGroups = getCollapsedGroups();
        document.querySelectorAll('.los-sidebar .los-nav-group').forEach(function (groupEl) {
            var key = groupEl.dataset.groupKey;
            if (collapsedGroups.indexOf(key) !== -1) {
                setGroupCollapsed(groupEl, true);
            }
            var label = groupEl.querySelector('.los-nav-group-label');
            if (label) {
                label.addEventListener('click', function () {
                    var collapsed = !groupEl.classList.contains('is-collapsed');
                    setGroupCollapsed(groupEl, collapsed);
                    var current = getCollapsedGroups();
                    var idx = current.indexOf(key);
                    if (collapsed && idx === -1) current.push(key);
                    if (!collapsed && idx !== -1) current.splice(idx, 1);
                    try {
                        window.localStorage.setItem(GROUPS_KEY, JSON.stringify(current));
                    } catch (ignored) {
                    }
                });
            }
        });

        document.querySelectorAll('.los-sidebar .los-nav-item').forEach(function (a) {
            if (a.target !== '_blank') {
                var href = a.getAttribute('href');
                if (window.location.pathname === href ||
                    window.location.pathname.startsWith(href + '/')) {
                    a.classList.add('active');
                }
            }
            a.addEventListener('click', function () {
                setMobileOpen(false);
            });
        });

        window.LeaderUiApi = {
            isDebugMode: function() {
                return new URLSearchParams(window.location.search).get('ui_debug') === '1';
            },
            notifyDebugHold: function(message) {
                console.info(message);
                const node = document.getElementById('leader-ui-debug-banner');
                if (!node) return;
                node.textContent = message;
                node.classList.remove('d-none');
            },
            request: async function(url, options) {
                const requestOptions = options ? {...options} : {};
                const method = (requestOptions.method || 'GET').toUpperCase();
                const body = requestOptions.body;

                console.group('LeaderOS API request');
                console.log('URL:', url);
                console.log('Method:', method);
                if (body != null) {
                    try {
                        console.log('Request body:', typeof body === 'string' ? JSON.parse(body) : body);
                    } catch (ignored) {
                    }
                }

                try {
                    const response = await fetch(url, requestOptions);
                    const raw = await response.text();
                    let parsed = raw;
                    try {
                        parsed = JSON.parse(raw);
                    } catch (ignored) {
                    }

                    console.log('Status:', response.status);
                    console.log('Response:', parsed);
                    window.__leaderUiLastResponse = {
                        url: url,
                        method: method,
                        status: response.status,
                        raw: raw,
                        data: parsed
                    };
                    console.groupEnd();

                    if (!response.ok) {
                        const error = new Error('HTTP ' + response.status);
                        error.response = response;
                        error.raw = raw;
                        error.data = parsed;
                        throw error;
                    }

                    return {response: response, raw: raw, data: parsed};
                } catch (error) {
                    console.error('LeaderOS API request failed', error);
                    console.groupEnd();
                    throw error;
                }
            },
            handleSuccess: function(success, result) {
                if (this.isDebugMode() && (success === 'reload' || success.startsWith('redirect:'))) {
                    this.notifyDebugHold('UI debug mode enabled: navigation skipped, inspect Fetch/XHR and window.__leaderUiLastResponse');
                    return;
                }

                if (success === 'reload') {
                    window.location.reload();
                } else if (success.startsWith('redirect:')) {
                    window.location.href = success.substring('redirect:'.length);
                }
            },
            formToJson: function(form) {
                const formData = new FormData(form);
                const payload = {};
                for (const [key, value] of formData.entries()) {
                    if (key.startsWith('_')) continue;
                    payload[key] = value;
                }
                return payload;
            },
            bindApiForms: function(selector) {
                document.querySelectorAll(selector || 'form[data-api-url]').forEach(function(form) {
                    if (form.dataset.apiBound === 'true') return;
                    if (form.dataset.apiCustomHandler === 'true') return;
                    form.dataset.apiBound = 'true';

                    form.addEventListener('submit', async function(event) {
                        event.preventDefault();

                        const apiUrl = form.dataset.apiUrl;
                        const apiMethod = (form.dataset.apiMethod || 'POST').toUpperCase();
                        const success = form.dataset.apiSuccess || 'reload';
                        const contentType = form.dataset.apiContentType || 'application/json';
                        const bodyMode = form.dataset.apiBody || 'json';

                        let body = null;
                        if (bodyMode === 'json') {
                            const json = window.LeaderUiApi.formToJson(form);
                            if (Object.keys(json).length > 0) {
                                body = JSON.stringify(json);
                            }
                        } else if (bodyMode === 'text') {
                            const field = form.querySelector('[data-api-text-field]');
                            body = field ? field.value : '';
                        }

                        try {
                            const result = await window.LeaderUiApi.request(apiUrl, {
                                method: apiMethod,
                                headers: body != null ? {'Content-Type': contentType} : {},
                                body: body
                            });

                            if (success === 'none') {
                                const eventName = form.dataset.apiEvent;
                                if (eventName) {
                                    window.dispatchEvent(new CustomEvent(eventName, {detail: {form, response: result.data}}));
                                }
                            } else {
                                window.LeaderUiApi.handleSuccess(success, result);
                            }
                        } catch (error) {
                            const message = form.dataset.apiErrorTarget
                                ? document.querySelector(form.dataset.apiErrorTarget)
                                : null;
                            if (message) {
                                message.textContent = 'API request failed: ' + error.message;
                                message.classList.remove('d-none');
                            }
                        }
                    });
                });
            }
        };

        document.addEventListener('DOMContentLoaded', function () {
            window.LeaderUiApi.bindApiForms('form[data-api-url]');
        });
    })();
</script>
</th:block>
<div id="leader-ui-debug-banner"
     class="alert alert-info rounded-0 border-0 text-center py-2 px-3 mb-0 d-none"
     style="position:sticky;top:0;z-index:999;">
    UI debug mode enabled
</div>
</body>
</html>
