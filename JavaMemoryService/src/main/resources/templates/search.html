<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Search')}"></head>
<body>
<div th:replace="~{fragments/layout :: sidebar}"></div>

<div class="container" style="max-width: 900px;">
    <h4 class="mb-4">Search LeaderOS</h4>

    <form method="get" action="/ui/search">
        <div class="input-group mb-3">
            <input type="text" name="q" class="form-control form-control-lg"
                   placeholder="Что ищем?"
                   th:value="${query}" autofocus autocomplete="off"/>
            <button class="btn btn-primary px-4" type="submit">Search</button>
        </div>

        <!-- Mode -->
        <div class="mb-3">
            <span class="text-muted small me-3">Mode:</span>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="mode" id="modeQuick" value="QUICK"
                       th:checked="${mode == null or mode == 'QUICK'}"/>
                <label class="form-check-label" for="modeQuick">Quick</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" name="mode" id="modeDeep" value="DEEP"
                       th:checked="${mode == 'DEEP'}"/>
                <label class="form-check-label" for="modeDeep">Deep AI Summary</label>
            </div>
        </div>

        <!-- Layers -->
        <div class="mb-3">
            <span class="text-muted small d-block mb-2">Layers:</span>
            <div class="d-flex flex-wrap gap-2">
                <th:block th:each="layer : ${availableLayers}">
                    <div class="form-check" th:if="${layer.available}">
                        <input class="form-check-input" type="checkbox"
                               name="layers" th:value="${layer.name}"
                               th:id="'layer-' + ${layer.name}"
                               th:checked="${selectedLayers.contains(layer.name)}"
                               th:disabled="${!layer.enabled}"/>
                        <label class="form-check-label" th:for="'layer-' + ${layer.name}"
                               th:classappend="${!layer.enabled} ? 'text-muted'"
                               th:text="${layer.title}"></label>
                    </div>
                    <div class="form-check" th:unless="${layer.available}">
                        <input class="form-check-input" type="checkbox" disabled/>
                        <label class="form-check-label text-muted">
                            <span th:text="${layer.title}"></span>
                            <small class="text-secondary"> (soon)</small>
                        </label>
                    </div>
                </th:block>
            </div>
        </div>

        <!-- Presets -->
        <div class="mb-4">
            <span class="text-muted small me-2">Presets:</span>
            <a href="/ui/search?preset=notice" class="btn btn-sm btn-outline-secondary me-1"
               th:classappend="${preset == 'notice'} ? 'active'">Notes only</a>
            <a href="/ui/search?preset=everything" class="btn btn-sm btn-outline-secondary me-1"
               th:classappend="${preset == 'everything'} ? 'active'">Everything</a>
            <a href="/ui/search?preset=documentation" class="btn btn-sm btn-outline-secondary me-1"
               th:classappend="${preset == 'documentation'} ? 'active'">Documentation</a>
            <a href="/ui/search?preset=people_tasks" class="btn btn-sm btn-outline-secondary"
               th:classappend="${preset == 'people_tasks'} ? 'active'">People &amp; Tasks</a>
        </div>
    </form>

    <!-- Results -->
    <div th:if="${searchResponse != null}">
        <hr/>
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-muted small">
                Results for: <strong th:text="${searchResponse.query}"></strong>
                &nbsp;·&nbsp; <span th:text="${#lists.size(searchResponse.results)}"></span> found
                &nbsp;·&nbsp; mode: <span th:text="${searchResponse.mode}"></span>
            </span>
        </div>

        <!-- Deep AI Summary -->
        <div th:if="${searchResponse.summary != null}" class="card mb-4 border-primary">
            <div class="card-header text-primary fw-bold small">AI Summary</div>
            <div class="card-body small" th:text="${searchResponse.summary}"></div>
        </div>

        <!-- Empty state -->
        <div th:if="${#lists.isEmpty(searchResponse.results)}" class="text-muted">
            Ничего не найдено по запросу «<span th:text="${searchResponse.query}"></span>»
        </div>

        <!-- Results grouped by layer -->
        <th:block th:each="entry : ${resultsByLayer}" th:if="${!#lists.isEmpty(entry.value)}">
            <div class="mb-1 mt-3">
                <span class="badge bg-secondary" th:text="${entry.key}"></span>
            </div>
            <div th:each="item : ${entry.value}" class="card mb-2">
                <div class="card-body py-2 px-3">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <a th:if="${item.url() != null}"
                               th:href="${item.url()}"
                               class="fw-semibold text-decoration-none"
                               th:text="${item.title()}"></a>
                            <span th:unless="${item.url() != null}"
                                  class="fw-semibold"
                                  th:text="${item.title()}"></span>
                            <div th:if="${item.snippet() != null}"
                                 class="text-muted small mt-1"
                                 th:text="${#strings.abbreviate(item.snippet(), 200)}"></div>
                        </div>
                        <span class="text-muted small ms-3 text-nowrap"
                              th:text="${'score: ' + #numbers.formatDecimal(item.score(), 1, 2)}"></span>
                    </div>
                </div>
            </div>
        </th:block>
    </div>
</div>
</body>
</html>
