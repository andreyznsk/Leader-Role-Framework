<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Риски')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Карта рисков</h4>
        <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#addModal">+ Добавить риск</button>
    </div>

    <!-- Status filter -->
    <div class="btn-group mb-3">
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${statusFilter == null} ? 'active'" href="/ui/risks">Все</a>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${statusFilter == 'OPEN'} ? 'active'" href="/ui/risks?status=OPEN">OPEN</a>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${statusFilter == 'MITIGATED'} ? 'active'" href="/ui/risks?status=MITIGATED">MITIGATED</a>
        <a class="btn btn-sm btn-outline-secondary" th:classappend="${statusFilter == 'CLOSED'} ? 'active'" href="/ui/risks?status=CLOSED">CLOSED</a>
    </div>

    <table class="table table-hover">
        <thead>
            <tr>
                <th>Риск</th>
                <th>Probability</th>
                <th>Impact</th>
                <th>Status</th>
                <th>Mitigation</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="risk : ${risks}" th:id="'risk-' + ${risk.id}">
                <td>
                    <strong th:text="${risk.title}"></strong>
                    <div th:if="${risk.description}" class="text-muted small" th:text="${risk.description}"></div>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${risk.probability == 'HIGH'} ? 'bg-danger' : (${risk.probability == 'MEDIUM'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${risk.probability}"></span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${risk.impact == 'HIGH'} ? 'bg-danger' : (${risk.impact == 'MEDIUM'} ? 'bg-warning text-dark' : 'bg-secondary')"
                          th:text="${risk.impact}"></span>
                </td>
                <td>
                    <span class="badge"
                          th:classappend="${risk.status == 'OPEN'} ? 'bg-danger' : (${risk.status == 'MITIGATED'} ? 'bg-success' : 'bg-secondary')"
                          th:text="${risk.status}"></span>
                </td>
                <td class="small text-muted" th:text="${risk.mitigation}"></td>
                <td>
                    <button class="btn btn-sm btn-outline-primary mb-1" data-bs-toggle="modal"
                            data-bs-target="#taskFromRiskModal"
                            th:attr="data-task-title=${#strings.abbreviate(risk.title, 200)},data-task-description=|Задача из риска #${risk.id}|">
                        &rarr; В задачу
                    </button>
                    <button class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal"
                            th:attr="data-bs-target='#edit-' + ${risk.id}">Edit</button>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- Edit modals -->
    <div th:each="risk : ${risks}">
        <div class="modal fade" th:id="'edit-' + ${risk.id}" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit: <span th:text="${risk.title}"></span></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form method="post" th:action="@{/ui/risks/{id}/edit(id=${risk.id})}"
                          th:attr="data-api-url=@{/api/risks/{id}(id=${risk.id})},data-api-method='PUT',data-api-success='reload'">
                        <input type="hidden" name="_method" value="PUT">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select name="status" class="form-select">
                                    <option value="OPEN" th:selected="${risk.status == 'OPEN'}">OPEN</option>
                                    <option value="MITIGATED" th:selected="${risk.status == 'MITIGATED'}">MITIGATED</option>
                                    <option value="ACCEPTED" th:selected="${risk.status == 'ACCEPTED'}">ACCEPTED</option>
                                    <option value="CLOSED" th:selected="${risk.status == 'CLOSED'}">CLOSED</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Mitigation</label>
                                <textarea name="mitigation" class="form-control" rows="3"
                                          th:text="${risk.mitigation}"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="taskFromRiskModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Создать задачу из риска</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="taskFromRiskForm">
                <div class="modal-body">
                    <input type="hidden" id="riskTaskDescription"/>
                    <div class="mb-3">
                        <label class="form-label" for="riskTaskTitle">Название *</label>
                        <input type="text" id="riskTaskTitle" class="form-control" maxlength="500" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Приоритет</label>
                        <div class="btn-group" role="group">
                            <input type="radio" class="btn-check" name="riskPriority" id="riskPriorityLow" value="LOW">
                            <label class="btn btn-outline-secondary" for="riskPriorityLow">LOW</label>
                            <input type="radio" class="btn-check" name="riskPriority" id="riskPriorityNormal" value="NORMAL" checked>
                            <label class="btn btn-outline-secondary" for="riskPriorityNormal">NORMAL</label>
                            <input type="radio" class="btn-check" name="riskPriority" id="riskPriorityHigh" value="HIGH">
                            <label class="btn btn-outline-secondary" for="riskPriorityHigh">HIGH</label>
                            <input type="radio" class="btn-check" name="riskPriority" id="riskPriorityCritical" value="CRITICAL">
                            <label class="btn btn-outline-secondary" for="riskPriorityCritical">CRITICAL</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="riskTaskDueDate">Срок</label>
                        <input type="date" id="riskTaskDueDate" class="form-control"/>
                    </div>
                    <div id="riskTaskCreateError" class="text-danger small d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Создать задачу</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Add risk modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Новый риск</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form method="post" action="/ui/risks/add"
                  data-api-url="/api/risks" data-api-method="POST" data-api-success="reload">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Название</label>
                        <input type="text" name="title" class="form-control" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Описание</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">Probability</label>
                            <select name="probability" class="form-select">
                                <option value="LOW">LOW</option>
                                <option value="MEDIUM" selected>MEDIUM</option>
                                <option value="HIGH">HIGH</option>
                            </select>
                        </div>
                        <div class="col">
                            <label class="form-label">Impact</label>
                            <select name="impact" class="form-select">
                                <option value="LOW">LOW</option>
                                <option value="MEDIUM" selected>MEDIUM</option>
                                <option value="HIGH">HIGH</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-warning">Добавить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function () {
    const params = new URLSearchParams(window.location.search);
    const editId = params.get('edit');
    if (editId) {
        const modalElement = document.getElementById('edit-' + editId);
        if (modalElement) {
            bootstrap.Modal.getOrCreateInstance(modalElement).show();
        }
    }

    const modal = document.getElementById('taskFromRiskModal');
    const form = document.getElementById('taskFromRiskForm');
    const title = document.getElementById('riskTaskTitle');
    const description = document.getElementById('riskTaskDescription');
    const dueDate = document.getElementById('riskTaskDueDate');
    const error = document.getElementById('riskTaskCreateError');

    modal.addEventListener('show.bs.modal', event => {
        const button = event.relatedTarget;
        title.value = button.dataset.taskTitle || '';
        description.value = button.dataset.taskDescription || '';
        dueDate.value = '';
        document.getElementById('riskPriorityNormal').checked = true;
        error.classList.add('d-none');
        error.textContent = '';
    });

    form.addEventListener('submit', event => {
        event.preventDefault();
        const payload = {
            title: title.value,
            description: description.value,
            priority: form.querySelector('input[name="riskPriority"]:checked').value,
            dueDate: dueDate.value || null
        };
        window.LeaderUiApi.request('/api/tasks/pending', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then((result) => {
            window.LeaderUiApi.handleSuccess('redirect:/ui/today', result);
        }).catch(err => {
            error.textContent = 'Не удалось создать задачу: ' + err.message;
            error.classList.remove('d-none');
        });
    });
})();
</script>
</body>
</html>
