<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/layout :: head('Capture Inbox')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-1">Capture Inbox</h4>
            <div class="text-muted small">Raw captures и результаты маршрутизации Operational Memory</div>
        </div>
        <button type="button" class="btn btn-sm btn-outline-secondary" id="processCapturesButton">Process Now</button>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="card">
                <div class="card-header">Today</div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(todayCaptures)}" class="text-muted p-3">Сегодня capture-записей нет</div>
                    <div th:each="capture : ${todayCaptures}" class="border-bottom p-3">
                        <div class="d-flex justify-content-between align-items-start gap-3">
                            <div>
                                <div class="small text-muted" th:text="${capture.source}">manual</div>
                                <div class="mt-1" th:text="${capture.rawText}">text</div>
                            </div>
                            <span class="badge bg-secondary" th:text="${capture.status}">PENDING</span>
                        </div>
                        <div class="small text-muted mt-2"
                             th:text="${capture.classified != null ? 'classified: ' + capture.classified + ', routed: ' + capture.routedTo : 'awaiting classification'}">
                            route
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="card">
                <div class="card-header">Recent</div>
                <div class="card-body p-0">
                    <div th:if="${#lists.isEmpty(recentCaptures)}" class="text-muted p-3">История пуста</div>
                    <div th:each="capture : ${recentCaptures}" class="border-bottom p-3">
                        <div class="small text-muted" th:text="${capture.source}">manual</div>
                        <div class="mt-1" th:text="${#strings.abbreviate(capture.rawText, 140)}">text</div>
                        <div class="small text-muted mt-2"
                             th:text="${capture.status + (capture.routedTo != null ? ' -> ' + capture.routedTo : '')}">
                            state
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
(function () {
    const button = document.getElementById('processCapturesButton');
    if (!button) return;
    button.addEventListener('click', function () {
        window.LeaderUiApi.request('/api/capture/process-now', {method: 'POST'})
            .then(function (result) { window.LeaderUiApi.handleSuccess('reload', result); });
    });
})();
</script>
</body>
</html>
