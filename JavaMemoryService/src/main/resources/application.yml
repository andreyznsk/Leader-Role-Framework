server:
  port: 8082
  tomcat:
    relaxed-query-chars: "|,{,},[,]"
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: java-memory-service
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  ai:
    mcp:
      server:
        enabled: true
        name: java-memory-service
        version: 1.0.0
        type: SYNC
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings

app:
  capture:
    inbox-dir: capture-inbox
  plugins:
    mail:
      base-url: http://localhost:8080
  rag:
    inbox-dir: ../JavaRagService/rag-inbox
    base-url: http://localhost:8081
  workspace:
    dir: workspace

capture:
  scheduler:
    cron: "0 0 * * * *"

agent:
  provider: claude

agentWorkspace:
  console:
    allowedCommands: claude
