server:
  port: 8082
  tomcat:
    relaxed-query-chars: "|,{,},[,]"
    uri-encoding: UTF-8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: java-memory-service
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  ai:
    mcp:
      server:
        enabled: true
        name: java-memory-service
        version: 1.0.0
        type: SYNC
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings

app:
  attachments:
    dir: workspace/attachments
    max-file-size: 20MB
    allowed-mime-prefixes: image/,application/pdf,text/
  capture:
    inbox-dir: capture-inbox
  plugins:
    mail:
      base-url: http://localhost:8080
  rag:
    inbox-dir: ../JavaRagService/rag-inbox
    base-url: http://localhost:8081
  workspace:
    dir: workspace

capture:
  scheduler:
    cron: "0 0 * * * *"

agent:
  provider: claude

jira:
  enabled: ${JIRA_ENABLED:false}
  base-url: ${JIRA_BASE_URL:}
  username: ${JIRA_USERNAME:}
  token: ${JIRA_TOKEN:}
  auth-type: ${JIRA_AUTH_TYPE:BEARER}
  default-project: ${JIRA_DEFAULT_PROJECT:}
  allowed-projects: ${JIRA_ALLOWED_PROJECTS:}
  default-issue-type: ${JIRA_DEFAULT_ISSUE_TYPE:Task}
  startup-check-enabled: ${JIRA_STARTUP_CHECK_ENABLED:true}
  timeout:
    connect: ${JIRA_TIMEOUT_CONNECT:5s}
    read: ${JIRA_TIMEOUT_READ:20s}

agentWorkspace:
  console:
    allowedCommands: claude
