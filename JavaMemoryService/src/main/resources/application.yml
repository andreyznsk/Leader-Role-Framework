server:
  port: 8082

spring:
  application:
    name: java-memory-service
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  ai:
    mcp:
      server:
        enabled: true
        name: java-memory-service
        version: 1.0.0
        type: SYNC
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message

management:
  endpoints:
    web:
      exposure:
        include: health,info,mappings

app:
  capture:
    inbox-dir: capture-inbox
  rag:
    inbox-dir: ../JavaRagService/rag-inbox
  workspace:
    dir: workspace
