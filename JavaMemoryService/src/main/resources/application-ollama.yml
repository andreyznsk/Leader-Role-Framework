# Профиль: Ollama локальный (агентский режим)
# Запуск: --spring.profiles.active=ollama
# Модель: qwen3:8b — локальная Ollama localhost:11434
server:
  port: 8090

spring:
  datasource:
    url: "jdbc:postgresql://172.80.2.1:5432/leader_framework?sslmode=disable"
    driver-class-name: org.postgresql.Driver
    username: memory_user
    password: memory_password
  flyway:
    locations: classpath:db/migration
    schemas: memory
    default-schema: memory
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:8b
        options:
          temperature: 0.0
          top-p: 1.0
          top-k: 20

jira:
  enabled: ${JIRA_ENABLED:true}
  base-url: ${JIRA_BASE_URL:http://172.80.2.1:19997}
  username: ${JIRA_USERNAME:}
  token: ${JIRA_TOKEN:test-token}
  auth-type: ${JIRA_AUTH_TYPE:BEARER}
  default-project: ${JIRA_DEFAULT_PROJECT:ENG}
  allowed-projects: ${JIRA_ALLOWED_PROJECTS:ENG,OPS}
  default-issue-type: ${JIRA_DEFAULT_ISSUE_TYPE:Task}
  startup-check-enabled: ${JIRA_STARTUP_CHECK_ENABLED:true}
  timeout:
    connect: ${JIRA_TIMEOUT_CONNECT:5s}
    read: ${JIRA_TIMEOUT_READ:20s}


app:
  capture:
    inbox-dir: capture-inbox
  rag:
    inbox-dir: rag-inbox

agent:
  provider: ollama
