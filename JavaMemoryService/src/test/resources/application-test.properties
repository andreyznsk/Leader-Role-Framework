spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.locations=classpath:db/migration,classpath:db/migration-h2

app.capture.inbox-dir=${java.io.tmpdir}/test-capture-inbox
app.rag.inbox-dir=${java.io.tmpdir}/test-rag-inbox
app.workspace.dir=${java.io.tmpdir}/test-workspace
